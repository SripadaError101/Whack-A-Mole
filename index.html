<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Whack-a-Mole — Simple Web Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Whack-a-Mole</h1>

    <div class="hud">
      <div class="score">Score: <span id="score">0</span></div>
      <div class="timer">Time: <span id="time">30</span>s</div>
      <button id="startBtn">Start</button>
    </div>

    <section class="board" id="board" aria-label="Game board" role="application">
      <!-- 9 holes generated by JS for clarity, or you can keep these static -->
      <div class="hole" data-index="0" tabindex="0" aria-label="Hole 1"></div>
      <div class="hole" data-index="1" tabindex="0" aria-label="Hole 2"></div>
      <div class="hole" data-index="2" tabindex="0" aria-label="Hole 3"></div>
      <div class="hole" data-index="3" tabindex="0" aria-label="Hole 4"></div>
      <div class="hole" data-index="4" tabindex="0" aria-label="Hole 5"></div>
      <div class="hole" data-index="5" tabindex="0" aria-label="Hole 6"></div>
      <div class="hole" data-index="6" tabindex="0" aria-label="Hole 7"></div>
      <div class="hole" data-index="7" tabindex="0" aria-label="Hole 8"></div>
      <div class="hole" data-index="8" tabindex="0" aria-label="Hole 9"></div>
    </section>

    <p class="notes">Click or tap the mole to score. Good luck!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
